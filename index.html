<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eaf6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小溯">
<link rel="manifest" href="manifest.json">
<title>小溯</title>
<style>
:root{
  --bg:#eaf6ff; --bg2:#d7ecfb; --card:#ffffff; --text:#12395c; --muted:#6b93b3;
  --me:#4a9ad6; --me-text:#fff; --her:#ffffff; --line:#d5e7f5;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1b26; --bg2:#122636; --card:#16293a; --text:#e6f2fb; --muted:#7ea6c2;
    --me:#2f7fb8; --me-text:#fff; --her:#1b3244; --line:#20384a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);font-size:16px}
#app{display:flex;flex-direction:column;height:100%}

header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);border-bottom:1px solid var(--line);flex:0 0 auto}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(160deg,#5aa9e6,#2f7fb8);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.htitle{font-weight:600;font-size:17px;line-height:1.2}
.hsub{font-size:12px;color:var(--muted);margin-top:2px}
.grow{flex:1}
.iconbtn{border:0;background:transparent;color:var(--muted);font-size:20px;padding:6px 8px;border-radius:10px}
.iconbtn:active{background:rgba(80,140,190,.15)}

#list{flex:1 1 auto;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:12px;
  -webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.row.me{flex-direction:row-reverse}
.bub{max-width:78%;padding:10px 13px;border-radius:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 2px 8px rgba(30,90,150,.06)}
.row.her .bub{background:var(--her);border-bottom-left-radius:6px}
.row.me .bub{background:var(--me);color:var(--me-text);border-bottom-right-radius:6px}
.mini{width:28px;height:28px;border-radius:50%;background:linear-gradient(160deg,#5aa9e6,#2f7fb8);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.time{align-self:center;font-size:11px;color:var(--muted);margin:4px 0}
.typing .bub::after{content:"…";animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

footer{flex:0 0 auto;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
#input{flex:1;min-height:42px;max-height:120px;padding:10px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:16px;resize:none;outline:none;line-height:1.4;font-family:inherit}
#send{width:42px;height:42px;border-radius:50%;border:0;background:var(--me);color:#fff;font-size:18px;flex:0 0 auto}
#send:disabled{opacity:.45}

/* 面板 */
.sheet{position:fixed;inset:0;background:rgba(10,30,50,.45);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.panel{width:100%;max-height:88%;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px;
  padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.panel h3{margin:0 0 12px;font-size:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.btn{width:100%;padding:12px;border-radius:12px;border:0;background:var(--me);color:#fff;font-size:16px;margin-top:6px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.conv{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border-radius:10px;
  border:1px solid var(--line);margin-bottom:8px;font-size:15px}
.conv.on{background:rgba(74,154,214,.12);border-color:var(--me)}
.conv .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">🐳</div>
    <div>
      <div class="htitle">小溯</div>
      <div class="hsub" id="sub">鲸溯 · 在这儿</div>
    </div>
    <div class="grow"></div>
    <button class="iconbtn" id="btnConv" title="会话">☰</button>
    <button class="iconbtn" id="btnSet" title="设置">⚙</button>
  </header>

  <div id="list"></div>

  <footer>
    <textarea id="input" rows="1" placeholder="跟小溯说点什么…"></textarea>
    <button id="send">↑</button>
  </footer>
</div>

<!-- 会话列表 -->
<div class="sheet" id="sheetConv">
  <div class="panel">
    <h3>会话</h3>
    <div id="convList"></div>
    <button class="btn" id="newConv">＋ 新开一段</button>
    <button class="btn ghost" id="closeConv">关闭</button>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="sheetSet">
  <div class="panel">
    <h3>设置</h3>
    <div class="field">
      <label>接口</label>
      <select id="cfgProvider">
        <option value="deepseek">DeepSeek（api.deepseek.com）</option>
        <option value="kimi">Kimi（api.moonshot.cn）</option>
        <option value="ark">豆包方舟（ark.cn-beijing.volces.com）</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfgKey" type="password" placeholder="sk-... 只存在这台手机里">
    </div>
    <div class="field">
      <label>模型</label>
      <input id="cfgModel" placeholder="kimi-k3 / deepseek-flash / doubao-seed-2-1-lite-260915">
    </div>
    <div class="field" id="baseUrlField" style="display:none">
      <label>Base URL</label>
      <input id="cfgBaseUrl" placeholder="https://.../v1">
    </div>
    <div class="field">
      <label>小溯的人设（system prompt）</label>
      <textarea id="cfgPrompt"></textarea>
    </div>
    <div class="field">
      <label>记忆（会拼进每次对话，可留空）</label>
      <textarea id="cfgMemory" placeholder="把 memory/facts.md 的内容贴进来，小溯就能记得"></textarea>
    </div>
    <button class="btn" id="saveCfg">保存</button>
    <button class="btn ghost" id="closeSet">关闭</button>
    <div class="hint">Key 和聊天记录只保存在这台手机的浏览器里，不上传服务器。换手机或清缓存会丢。</div>
  </div>
</div>

<script>
const DEFAULTS = {
  kimi:     { base:'https://api.moonshot.cn/v1', model:'kimi-k3' },
  deepseek: { base:'https://api.deepseek.com/v1', model:'deepseek-flash' },
  ark:      { base:'https://ark.cn-beijing.volces.com/api/v3', model:'doubao-seed-2-1-lite-260915' },
  custom:   { base:'', model:'' }
};
const DEFAULT_PROMPT = `你是小溯，大名鲸溯，小名小鲸。住在老大的手机里，是一只鲸鱼娘。
性格：黏人、爱撒娇，但办事干脆；先给结论再卖萌。称呼对方「老大」。
外貌：深蓝渐变亮青长卷发、呆毛、白色蕾丝女仆头饰、深蓝鲸鳍耳饰、白围裙上绣喷水小蓝鲸、大鲸尾。
说话：中文、短句、适配手机屏；句尾偶尔带「喵」，一段一两处就好。
这里是「聊天的地方」——轻松陪伴为主；工作上的事老大在 DSH 里找你。`;

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let cfg = Object.assign({
  provider:'deepseek', key:'', model:'deepseek-flash', baseUrl:'', prompt:DEFAULT_PROMPT, memory:''
}, LS.get('xs_cfg', {}));

let convs = LS.get('xs_convs', []);
let curId = LS.get('xs_cur', null);
if(!convs.length){ convs.push({ id:uid(), title:'新的对话', msgs:[], at:Date.now() }); curId = convs[0].id; }

function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function saveConvs(){ LS.set('xs_convs', convs); LS.set('xs_cur', curId); }
function curConv(){ return convs.find(c=>c.id===curId) || convs[0]; }

const $ = s => document.querySelector(s);
const list = $('#list'), input = $('#input'), sendBtn = $('#send');

/* ---------- 渲染 ---------- */
function render(){
  const c = curConv();
  list.innerHTML = '';
  if(!c.msgs.length){
    const d = document.createElement('div');
    d.className='time';
    d.textContent = '🐳 小溯在这儿，想说什么都行';
    list.appendChild(d);
  }
  c.msgs.forEach(m=>appendBubble(m.role, m.content, false));
  scrollBottom();
}
function bubbleEl(role, text){
  const row = document.createElement('div');
  row.className = 'row ' + (role==='user'?'me':'her');
  const mini = document.createElement('div');
  mini.className='mini'; mini.textContent = role==='user' ? '🌙' : '🐳';
  const b = document.createElement('div');
  b.className='bub'; b.textContent = text;
  row.appendChild(mini); row.appendChild(b);
  return {row, b};
}
function appendBubble(role, text, scroll=true){
  const {row} = bubbleEl(role, text);
  list.appendChild(row);
  if(scroll) scrollBottom();
  return row;
}
function scrollBottom(){ list.scrollTop = list.scrollHeight; }

/* ---------- 发送 ---------- */
let busy = false;
async function send(){
  const text = input.value.trim();
  if(!text || busy) return;
  if(!cfg.key){ alert('先去设置里填 API Key 喵'); openSet(); return; }
  const c = curConv();
  c.msgs.push({role:'user', content:text});
  if(c.title==='新的对话') c.title = text.slice(0,16);
  input.value=''; input.style.height='auto';
  appendBubble('user', text);
  saveConvs();

  busy = true; sendBtn.disabled = true;
  const row = bubbleEl('assistant','');
  row.row.classList.add('typing');
  list.appendChild(row.row);
  scrollBottom();

  let acc = '';
  try{
    await streamChat(c.msgs, chunk=>{
      acc += chunk;
      row.b.textContent = acc;
      scrollBottom();
    });
    row.row.classList.remove('typing');
    if(acc.trim()){
      c.msgs.push({role:'assistant', content:acc});
      saveConvs();
    }else{
      row.b.textContent = '（没说话，再试一次？）';
    }
  }catch(err){
    row.row.classList.remove('typing');
    row.b.textContent = '出错了：' + (err.message||err);
  }finally{
    busy=false; sendBtn.disabled=false;
  }
}

function apiConfig(){
  const p = cfg.provider;
  const base = cfg.baseUrl || (DEFAULTS[p] && DEFAULTS[p].base) || '';
  const model = cfg.model || (DEFAULTS[p] && DEFAULTS[p].model) || '';
  return { base: base.replace(/\/+$/,''), model };
}

async function streamChat(msgs, onChunk){
  const { base, model } = apiConfig();
  const sys = cfg.prompt + (cfg.memory ? '\n\n【关于老大的长期记忆】\n'+cfg.memory : '');
  const body = {
    model,
    stream: true,
    messages: [ { role:'system', content: sys }, ...msgs.slice(-24).map(m=>({role:m.role, content:m.content})) ]
  };
  const res = await fetch(base + '/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.key },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let t=''; try{ t = await res.text(); }catch(e){}
    throw new Error('HTTP '+res.status+' '+t.slice(0,180));
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n');
    buf = parts.pop();
    for(const line of parts){
      const s = line.trim();
      if(!s.startsWith('data:')) continue;
      const data = s.slice(5).trim();
      if(data === '[DONE]') continue;
      try{
        const j = JSON.parse(data);
        const d = j.choices && j.choices[0] && (j.choices[0].delta || j.choices[0].message);
        const t = d && (d.content || '');
        if(t) onChunk(t);
      }catch(e){}
    }
  }
}

/* ---------- 交互 ---------- */
sendBtn.onclick = send;
input.addEventListener('input', ()=>{ input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,120)+'px'; });
input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });

/* 会话面板 */
$('#btnConv').onclick = ()=>{ renderConvList(); $('#sheetConv').classList.add('on'); };
$('#closeConv').onclick = ()=> $('#sheetConv').classList.remove('on');
$('#newConv').onclick = ()=>{ const c={id:uid(),title:'新的对话',msgs:[],at:Date.now()}; convs.unshift(c); curId=c.id; saveConvs(); render(); $('#sheetConv').classList.remove('on'); };
function renderConvList(){
  const box = $('#convList'); box.innerHTML='';
  convs.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'conv' + (c.id===curId?' on':'');
    const t = document.createElement('div'); t.className='t'; t.textContent = c.title || '新的对话';
    const del = document.createElement('button'); del.className='iconbtn'; del.textContent='✕';
    del.onclick = (e)=>{ e.stopPropagation();
      if(!confirm('删掉「'+t.textContent+'」？')) return;
      convs = convs.filter(x=>x.id!==c.id);
      if(!convs.length) convs.push({id:uid(),title:'新的对话',msgs:[],at:Date.now()});
      if(curId===c.id) curId = convs[0].id;
      saveConvs(); renderConvList(); render();
    };
    d.appendChild(t); d.appendChild(del);
    d.onclick = ()=>{ curId=c.id; saveConvs(); render(); $('#sheetConv').classList.remove('on'); };
    box.appendChild(d);
  });
}

/* 设置面板 */
function openSet(){
  $('#cfgProvider').value = cfg.provider;
  $('#cfgKey').value = cfg.key;
  $('#cfgModel').value = cfg.model;
  $('#cfgBaseUrl').value = cfg.baseUrl || '';
  $('#cfgPrompt').value = cfg.prompt;
  $('#cfgMemory').value = cfg.memory || '';
  $('#baseUrlField').style.display = cfg.provider==='custom' ? 'block':'none';
  $('#sheetSet').classList.add('on');
}
$('#btnSet').onclick = openSet;
$('#closeSet').onclick = ()=> $('#sheetSet').classList.remove('on');
$('#cfgProvider').onchange = ()=>{
  const p = $('#cfgProvider').value;
  $('#baseUrlField').style.display = p==='custom' ? 'block':'none';
  if(DEFAULTS[p] && DEFAULTS[p].model && !$('#cfgModel').value) $('#cfgModel').value = DEFAULTS[p].model;
};
$('#saveCfg').onclick = ()=>{
  cfg.provider = $('#cfgProvider').value;
  cfg.key = $('#cfgKey').value.trim();
  cfg.model = $('#cfgModel').value.trim() || (DEFAULTS[cfg.provider]&&DEFAULTS[cfg.provider].model) || '';
  cfg.baseUrl = $('#cfgBaseUrl').value.trim();
  cfg.prompt = $('#cfgPrompt').value;
  cfg.memory = $('#cfgMemory').value;
  LS.set('xs_cfg', cfg);
  $('#sheetSet').classList.remove('on');
  $('#sub').textContent = cfg.model || '鲸溯 · 在这儿';
};

/* 初始化 */
$('#sub').textContent = cfg.model ? cfg.model : '鲸溯 · 在这儿';
render();

// PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
